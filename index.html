<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Monster Bash</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top-header">
    <div>
      <h1>IELTS Monster Bash</h1>
      <p>打败可爱怪兽，收集你的雅思单词星球 ✨</p>
    </div>

    <div class="player-card">
      <div class="avatar">👩🏻‍🏫</div>
      <div>
        <strong>Yuchun</strong>
        <span>IELTS Explorer Lv.1</span>
      </div>
    </div>
  </header>

  <div id="app">

    <aside id="sidebar" class="side-card">
      <h2>🌟 已背单词</h2>
      <ul id="learned-list"></ul>
    </aside>

    <main id="game-panel">
      <section id="monster"></section>

      <input type="text" placeholder="输入单词，攻击怪兽！">

      <div id="tools">
        <textarea id="word-import" placeholder="输入单词，必须使用格式：
英文单词,词性,中文释义
例如：
facilitate,v.,促进；使容易
academic,adj.,学术的
evidence,n.,证据"></textarea>

        <button id="import-btn">导入单词</button>
        <button id="export-btn">导出学习数据</button>
      </div>
    </main>

    <aside id="todo-sidebar" class="side-card">
      <h2>📚 待背单词</h2>
      <ul id="todo-list"></ul>
    </aside>

  </div>

  <script src="script.js"></script>

</body>
</html>
